name: Build noid image

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Build Live ISO (${{ matrix.de }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        de: [xfce, kde, gnome]
    container:
      image: "ghcr.io/void-linux/void-mklive:20250116R1"
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu

      - name: Create output directory
        run: |
          mkdir -p /github/workspace/images

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Build live ISO
        run: ./mknoid.sh ${{ matrix.de }} /github/workspace/images/noid-${{ matrix.de }}.iso

      - name: Upload built ISO
        uses: actions/upload-artifact@v4
        with:
          name: noid-${{ matrix.de }}-iso
          path: /github/workspace/images/*.iso
          retention-days: 1

  upload-to-sf-and-r2:
    needs: build-live-iso
    runs-on: ubuntu-latest

    steps:
      - name: Download built ISOs
        uses: actions/download-artifact@v4
        with:
          pattern: noid-*-iso
          path: ./images/
          merge-multiple: true

      - name: Create release tag
        id: create_tag
        run: |
          # Get current date in YYYYMMDD format
          DATE=$(date +"%Y%m%d")
          echo "release_tag=noid-linux-${DATE}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 checksums
        working-directory: ./images
        run: sha256sum *.iso > sha256sum.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
            --pinentry-mode loopback \
            --detach-sign --armor ./images/sha256sum.txt
          mv ./images/sha256sum.txt.asc ./images/sha256sum.txt.gpg

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Delete all old releases (R2)
        run: rclone delete r2:noid-linux/ --rmdirs

      - name: Upload to R2
        run: |
          rclone copy ./images/ r2:noid-linux/ --progress \
            --s3-upload-concurrency 4

      - name: Upload to SourceForge
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SF_SSH_KEY" > ~/.ssh/sf_key
          chmod 600 ~/.ssh/sf_key

          # Add SourceForge to known hosts
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts

          # Upload ISOs via rsync
          rsync -avP -e "ssh -i ~/.ssh/sf_key" \
              ./images/*.iso \
              ndpm13@frs.sourceforge.net:/home/frs/project/noid-linux/${{ steps.create_tag.outputs.release_tag }}
