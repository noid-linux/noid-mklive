name: Build noid image

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Build Live ISOs
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create_tag.outputs.release_tag }}
    container:
      image: "ghcr.io/void-linux/void-mklive:20250116R1"
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu

      - name: Create output directory
        run: |
          mkdir -p /github/workspace/images

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Build live ISO
        run: ./mknoid.sh /github/workspace/images/noid.iso

      - name: Upload built ISO
        uses: actions/upload-artifact@v4
        with:
          name: built-iso
          path: /github/workspace/images/noid.iso
          retention-days: 1

      - name: Create release tag
        id: create_tag
        run: |
          # Get current date in YYYYMMDD format
          DATE=$(date +"%Y%m%d")
          echo "release_tag=noid-linux-${DATE}" >> $GITHUB_OUTPUT

  create-github-release:
    needs: build-live-iso
    runs-on: ubuntu-latest

    steps:
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: built-iso
          path: ./images/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-live-iso.outputs.release_tag }}
          name: Noid Linux Release ${{ needs.build-live-iso.outputs.release_tag }}
          body: |
            Noid Linux ISO Build
            - Based on Void Linux (XFCE)
            - Pre-installed packages: neovim, alacritty, starship, brave, nerd-fonts-cascadiacode, ndpm, flatpak, gparted
            - Linux kernel: linux-lts
            - Graphical Installer: Calamares

            [![Download Noid Linux](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/noid-linux/files/latest/download)
          files: ./images/noid.iso
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
