name: Build noid images

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      datecode: ${{ steps.prep.outputs.datecode }}

    steps:
      - name: Prepare Environment
        id: prep
        run: echo "datecode=$(date -u "+%Y%m%d")" >> $GITHUB_OUTPUT

  build-live-isos:
    name: Build Live ISOs
    runs-on: ubuntu-latest
    needs: prepare

    container:
      image: "ghcr.io/void-linux/void-mklive:latest"
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"
        FLAVOR: "${{ matrix.config.flavor }}"
        INIT: "${{ matrix.config.init }}"

    strategy:
      fail-fast: false
      matrix:
        config:
          - { flavor: xfce, init: dinit }
          - { flavor: xfce, init: runit }
          - { flavor: kde, init: runit }
          - { flavor: gnome, init: runit }

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Build live ISOs
        run: |
          make noid-live-iso-all-print noid-live-iso-all SUDO= \
            DATECODE="${{ needs.prepare.outputs.datecode }}" \
            NOID_LIVE_FLAVORS="$FLAVOR" NOID_LIVE_INIT_SYSTEMS="$INIT"

      - name: Prepare artifacts for upload
        run: |
          make noid-dist DATECODE="${{ needs.prepare.outputs.datecode }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: noid-iso-${{ matrix.config.flavor }}-${{ matrix.config.init }}-${{ needs.prepare.outputs.datecode }}
          path: distdir-${{ needs.prepare.outputs.datecode }}/*
          if-no-files-found: error

  upload-to-sf:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-live-isos

    container:
      image: "ghcr.io/void-linux/void-mklive:latest"
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu && xbps-install -y openssh rsync

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: distdir-${{ needs.prepare.outputs.datecode }}
          merge-multiple: true

      - name: Prepare artifacts for upload
        run: |
          make checksum DATECODE="${{ needs.prepare.outputs.datecode }}"

      - name: Upload to SourceForge
        env:
          SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}
        run: |
          # Setup SSH key
          mkdir -p /root/.ssh
          echo "$SF_SSH_KEY" > /root/.ssh/sf_key
          chmod 600 /root/.ssh/sf_key

          # Add SourceForge to known hosts
          ssh-keyscan frs.sourceforge.net >> /root/.ssh/known_hosts

          # Upload ISOs via rsync
          rsync -avP -e "ssh -i /root/.ssh/sf_key" \
              ./"distdir-${{ needs.prepare.outputs.datecode }}"/* \
              ndpm13@frs.sourceforge.net:/home/frs/project/noid-linux/noid-live-${{ needs.prepare.outputs.datecode }}

  upload-to-cloudflare:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-live-isos

    container:
      image: "ghcr.io/void-linux/void-mklive:latest"
      env:
        PATH: "/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin"

    steps:
      - name: Prepare container
        shell: sh
        run: xbps-install -Syu xbps && xbps-install -yu && xbps-install -y gnupg rclone

      - name: Clone and checkout
        uses: classabbyamp/treeless-checkout-action@v1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: distdir-${{ needs.prepare.outputs.datecode }}
          merge-multiple: true

      - name: Prepare artifacts for upload
        run: |
          cd "distdir-${{ needs.prepare.outputs.datecode }}"
          mv noid*gnome.iso noid-gnome.iso
          mv noid*kde.iso noid-kde.iso
          mv noid*xfce.iso noid-xfce.iso
          mv noid*xfce-dinit.iso noid-xfce-dinit.iso
          cd -

          make checksum DATECODE="${{ needs.prepare.outputs.datecode }}"

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          cd "distdir-${{ needs.prepare.outputs.datecode }}"
          gpg --batch --yes --pinentry-mode loopback --detach-sign \
            --armor sha256sum.txt
          mv sha256sum.txt.asc sha256sum.txt.gpg

      - name: Configure rclone for R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.config/rclone
          cat << EOF > ~/.config/rclone/rclone.conf
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
          acl = public-read
          EOF

      - name: Delete all old releases (R2)
        run: rclone delete r2:noid-linux/ --rmdirs

      - name: Upload to R2
        run: |
          rclone copy ./"distdir-${{ needs.prepare.outputs.datecode }}"/ r2:noid-linux/ --progress \
            --s3-upload-concurrency 4
