name: Build noid images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create_tag.outputs.release_tag }}
    container:
      image: ghcr.io/void-linux/void-mklive:20250116R1
      options: --privileged

    steps:
      - name: Install required packages
        run: |
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y git bash make cdrtools qemu-user-static liblz4 squashfs-tools xorriso xmlto python3 python3-Markdown

      - name: Clone noid-mklive repository
        run: |
          git clone https://github.com/noid-linux/noid-mklive.git
          cd noid-mklive

      - name: Set up permissions
        run: |
          cd noid-mklive
          chmod +x ./mkiso.sh
          chmod +x ./mklive.sh
          chmod +x ./mkrootfs.sh
          chmod +x ./installer.sh

      - name: Create output directory
        run: |
          mkdir -p /github/workspace/images

      - name: Build Noid Linux ISO
        run: |
          cd noid-mklive
          yes | ./mkiso.sh -a x86_64 -b xfce -r "https://github.com/noid-linux/xbps-repo/releases/latest/download" -- -p "neovim alacritty starship brave gruvbox-material-theme gruvbox-bibata-cursor-theme nerd-fonts-cascadiacode ndpm flatpak gparted noid-welcome calamares" -I noid -C "live.autologin" -T "Noid Linux" -v "linux-lts" -o /github/workspace/images/noid.iso

      - name: Upload built ISO
        uses: actions/upload-artifact@v4
        with:
          name: built-iso
          path: /github/workspace/images/noid.iso
          retention-days: 1

      - name: Create release tag
        id: create_tag
        run: |
          # Get current date in YYYYMMDD format
          DATE=$(date +"%Y%m%d")
          echo "release_tag=noid-linux-${DATE}" >> $GITHUB_OUTPUT

  create-github-release:
    needs: build-iso
    runs-on: ubuntu-latest

    steps:
      - name: Download built ISO
        uses: actions/download-artifact@v4
        with:
          name: built-iso
          path: ./images/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-iso.outputs.release_tag }}
          name: Noid Linux Release ${{ needs.build-iso.outputs.release_tag }}
          body: |
            Noid Linux ISO Build
            - Based on Void Linux (XFCE)
            - Pre-installed packages: neovim, alacritty, starship, brave, nerd-fonts-cascadiacode, ndpm, flatpak, gparted
            - Linux kernel: linux-lts
            - Graphical Installer: Calamares

            [![Download Noid Linux](https://a.fsdn.com/con/app/sf-download-button)](https://sourceforge.net/projects/noid-linux/files/latest/download)
          files: ./images/noid.iso
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

